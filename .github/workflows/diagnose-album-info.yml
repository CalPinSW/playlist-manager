name: Diagnose album info lookup (temporary)

# Manual, one-off diagnostic — not part of normal CI. Delete this workflow once the
# album-info summary bug is understood/fixed. GitHub-hosted runners have normal internet
# access, needed because the dev sandbox's egress proxy blocks musicbrainz.org,
# wikidata.org, wikipedia.org, and last.fm entirely.
on:
  workflow_dispatch: {}

defaults:
  run:
    working-directory: playlist-manager-next

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playlist-manager-next/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/diagnose-album-info.ts
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
