name: Native CI

on:
  push:
    branches: [main]
    paths:
      - 'playlist-manager-native/**'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'playlist-manager-native/**'
      - '.github/workflows/native-ci.yml'

defaults:
  run:
    working-directory: playlist-manager-native

env:
  NODE_VERSION: 22

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: playlist-manager-native/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: playlist-manager-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: playlist-manager-native/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
